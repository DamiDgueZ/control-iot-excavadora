<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control IoT | Excavadora</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body class="p-0 d-flex flex-column min-vh-100">
    <!-- Navbar / Navegación y Estado -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4 shadow-lg border-bottom border-secondary flex-shrink-0" style="background: rgba(10,12,16,0.95) !important;">
        <span class="navbar-brand mb-0 h1 fw-bold me-4"><i class="fas fa-gamepad text-warning me-2"></i>Plataforma IoT</span>
        
        <ul class="navbar-nav me-auto flex-row gap-3">
            <li class="nav-item">
                <a class="nav-link active fw-bold text-light" href="index.html"><i class="fas fa-sliders-h me-1"></i> Control</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-secondary" href="monitoreo.html"><i class="fas fa-chart-line me-1"></i> Monitoreo</a>
            </li>
        </ul>

        <div class="d-flex gap-3 mt-2 mt-lg-0 align-items-center">
            <span id="badge-demo" class="badge bg-warning text-dark p-2 fs-6 shadow-sm d-none">
                <i class="fas fa-cogs fa-spin me-1"></i>DEMO EN CURSO
            </span>
            <span id="badge-wss" class="badge bg-danger p-2 fs-6 shadow-sm"><i class="fas fa-plug me-1"></i>WSS: Desconectado</span>
            <span id="badge-api" class="badge bg-danger p-2 fs-6 shadow-sm"><i class="fas fa-server me-1"></i>API: ...</span>
            <span id="badge-rds" class="badge bg-danger p-2 fs-6 shadow-sm"><i class="fas fa-database me-1"></i>RDS: ...</span>
        </div>
    </nav>

    <!-- Contenedor Principal Adaptable -->
    <div class="container-fluid max-w-1200 px-3 flex-grow-1 d-flex flex-column justify-content-center align-items-center my-3">
        <div class="row g-4 align-items-center justify-content-center w-100">
            
            <!-- Mando Estilo Gamepad -->
            <div class="col-lg-9 col-xl-8">
                <div class="gamepad-container p-3 p-md-4 shadow-lg">
                    <div class="row align-items-center">
                        <!-- Joystick Tracción -->
                        <div class="col-md-5 text-center joystick-panel">
                            <h5 class="text-info mb-3 fw-bold"><i class="fas fa-truck me-2"></i>TRACCIÓN</h5>
                            <div id="joystick-izq" class="joystick-zone"></div>
                            <div id="lbl-izq" class="mt-3 badge bg-secondary px-4 py-2 fs-6 shadow-sm rounded-pill">DETENIDO</div>
                        </div>

                        <!-- Botones Centrales -->
                        <div class="col-md-2 px-2 d-flex flex-column justify-content-center align-items-center my-3 my-md-0">
                            <button id="btn-encendido" class="btn btn-danger btn-lg btn-gamepad w-100 mb-2 py-3 shadow" onclick="toggleEncendido()" title="Sistema On/Off">
                                <i class="fas fa-power-off fa-lg"></i>
                            </button>
                            
                            <button id="btn-luces" class="btn btn-outline-warning btn-gamepad w-100 mb-2 py-2" onclick="toggleLuces()" title="Luces">
                                <i class="fas fa-lightbulb"></i>
                            </button>
                            
                            <button id="btn-claxon" class="btn btn-outline-info btn-gamepad w-100 mb-2 py-2" onclick="toggleClaxon()" title="Claxon">
                                <i class="fas fa-volume-up"></i>
                            </button>
                            
                            <div class="input-group mb-2 w-100 shadow-sm justify-content-center">
                                <input type="number" class="form-control bg-dark text-light border-secondary text-center fw-bold" 
                                       id="input-demo" min="1" value="1" placeholder="N°" style="font-size: 1rem; max-width: 60px; padding: 5px;">
                                <button class="btn btn-outline-secondary btn-gamepad text-light px-3" onclick="ejecutarDemoSeleccionada()" title="Iniciar Demo">
                                    <i class="fas fa-play"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Joystick Brazo/Rotación -->
                        <div class="col-md-5 text-center joystick-panel">
                            <h5 class="text-warning mb-3 fw-bold"><i class="fas fa-cogs me-2"></i>BRAZO & ROT</h5>
                            <div id="joystick-der" class="joystick-zone"></div>
                            <div id="lbl-der" class="mt-3 badge bg-secondary px-4 py-2 fs-6 shadow-sm rounded-pill">DETENIDO</div>
                        </div>
                    </div>
                    
                    <!-- Botón de Paro de Emergencia -->
                    <div class="row mt-3">
                        <div class="col-12 text-center">
                            <button class="btn btn-danger btn-lg w-100 w-md-75 py-2 fw-bold text-uppercase shadow-lg rounded-pill" style="border: 2px solid rgba(255,255,255,0.2); background: linear-gradient(135deg, #dc3545, #a71d2a);" onclick="forzarParo()">
                                <i class="fas fa-hand-paper me-2"></i>DETENER TODO (PARO DE EMERGENCIA)
                            </button>
                        </div>
                    </div>

                    <!-- Indicador miniatura de Último Movimiento -->
                    <div class="row mt-3">
                        <div class="col-12">
                            <div class="p-2 rounded bg-black bg-opacity-50 border border-secondary text-center shadow-inner d-flex flex-column flex-md-row justify-content-between align-items-center px-3">
                                <span class="text-secondary small text-uppercase mb-1 mb-md-0"><i class="fas fa-info-circle me-1 text-info"></i>Último Estado:</span>
                                <span id="ctrl-ultimo-mov" class="fw-bold text-info font-monospace mb-1 mb-md-0">ESPERANDO...</span>
                                <span id="ctrl-ultimo-tiempo" class="text-muted small">--:--:--</span>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <!-- Pie de Página Fijo -->
    <footer class="text-center p-2 text-secondary flex-shrink-0" style="background: rgba(0, 0, 0, 0.95); border-top: 1px solid rgba(255, 255, 255, 0.05);">
        <small><strong>Ingeniería en Sistemas Computacionales | TecNM Campus Pachuca</strong> | Desarrollado por Damaris Domínguez Zapata · 2026</small>
    </footer>

    <!-- LÓGICA LOCAL DE CONTROL -->
    <script src="assets/js/app.js"></script>
</body>

</html>
